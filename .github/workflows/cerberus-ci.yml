# Connector workflow-editing permission test; no workflow behavior changes.
name: CERBERUS Repository Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cerberus-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Validate framework and templates
        run: python scripts/validate.py
      - name: Check Bash syntax
        run: bash -n setup-cerberus.sh
      - name: Run setup integration tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Run service and HTTP timeout tests
        run: |
          python -m unittest \
            minimal_service.test_service \
            minimal_service.test_http_timeout \
            -v
      - name: Check tracked whitespace
        run: git diff-tree --check --root HEAD
      - name: Record check scope
        run: |
          echo 'Structural checks, setup integration tests, service unit tests, and HTTP timeout regression tests passed. External retrieval, deployment, factual, usability, and broader security review remain required.' >> "$GITHUB_STEP_SUMMARY"
